<!DOCTYPE html>

<html class="dark" lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/><meta content="web_blank" name="shell-type"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400;500;600;700&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{margin:0;padding:0;}body{overscroll-behavior:none;}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "outline": "#8d919b", "on-primary-container": "#0d4582", "secondary": "#adc7ff", "surface-container-highest": "#343538", "secondary-fixed-dim": "#adc7ff", "primary-fixed-dim": "#a8c8ff", "surface-bright": "#38393c", "on-surface": "#e3e2e6", "on-tertiary-container": "#274a51", "tertiary-fixed-dim": "#a8cdd4", "surface-container-lowest": "#0d0e11", "on-tertiary-fixed-variant": "#294c52", "on-secondary-container": "#f2f4ff", "surface": "#121316", "surface-tint": "#a8c8ff", "outline-variant": "#424750", "surface-dim": "#121316", "on-primary-fixed": "#001b3c", "on-secondary-fixed-variant": "#004493", "on-tertiary-fixed": "#001f24", "on-surface-variant": "#c3c6d1", "primary": "#b5cfff", "error-container": "#93000a", "tertiary": "#b0d5dc", "on-error": "#690005", "inverse-on-surface": "#2f3033", "surface-variant": "#343538", "on-background": "#e3e2e6", "surface-container-low": "#1a1b1e", "inverse-surface": "#e3e2e6", "secondary-container": "#026be0", "secondary-fixed": "#d8e2ff", "surface-container-high": "#292a2d", "surface-container": "#1e2022", "on-tertiary": "#10353c", "on-secondary": "#002e68", "primary-container": "#8ab4f8", "error": "#ffb4ab", "on-primary": "#003061", "tertiary-container": "#95b9c1", "on-secondary-fixed": "#001a41", "background": "#121316", "primary-fixed": "d5e3ff", "on-primary-fixed-variant": "#114784", "inverse-primary": "#315f9d", "tertiary-fixed": "#c4e9f1", "on-error-container": "#ffdad6" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "space-xl": "1.5rem", "gutter-lg": "1.5rem", "space-xs": "0.25rem", "space-lg": "1rem", "space-2xl": "2rem", "margin": "1rem", "margin-lg": "3.5rem", "space-md": "0.75rem", "space-sm": "0.5rem", "margin-md": "2rem", "gutter": "1rem" }, "fontFamily": { "label-lg": ["Roboto Flex"], "headline-xl-mobile": ["Roboto Flex"], "title-md": ["Roboto Flex"], "label-md": ["Roboto Flex"], "display-lg": ["Roboto Flex"], "body-sm": ["Roboto Flex"], "headline-xl": ["Roboto Flex"], "headline-md": ["Roboto Flex"], "body-md": ["Roboto Flex"], "body-lg": ["Roboto Flex"] }, "fontSize": { "label-lg": ["0.875rem", { "lineHeight": "1.25rem", "letterSpacing": "0.01em", "fontWeight": "500" }], "headline-xl-mobile": ["1.75rem", { "lineHeight": "2.25rem", "letterSpacing": "0em", "fontWeight": "500" }], "title-md": ["1.125rem", { "lineHeight": "1.5rem", "letterSpacing": "0.01em", "fontWeight": "500" }], "label-md": ["0.75rem", { "lineHeight": "1rem", "letterSpacing": "0.03em", "fontWeight": "500" }], "display-lg": ["3.5rem", { "lineHeight": "4.25rem", "letterSpacing": "-0.02em", "fontWeight": "400" }], "body-sm": ["0.75rem", { "lineHeight": "1rem", "letterSpacing": "0.02em", "fontWeight": "400" }], "headline-xl": ["2.25rem", { "lineHeight": "2.75rem", "letterSpacing": "-0.01em", "fontWeight": "400" }], "headline-md": ["1.375rem", { "lineHeight": "1.75rem", "letterSpacing": "0em", "fontWeight": "500" }], "body-md": ["0.875rem", { "lineHeight": "1.25rem", "letterSpacing": "0.015em", "fontWeight": "400" }], "body-lg": ["1rem", { "lineHeight": "1.5rem", "letterSpacing": "0.01em", "fontWeight": "400" }] } } } };</script></head><body class="bg-surface font-body-md text-body-md text-on-surface antialiased min-h-screen flex items-center justify-center p-space-lg"><main class="w-full max-w-md"><div class="flex flex-col w-full">
<div class="relative w-full overflow-hidden rounded-lg bg-surface-container-low p-space-2xl shadow-xl">
<div class="absolute -top-24 -right-24 h-48 w-48 rounded-full bg-primary/5 blur-3xl pointer-events-none"></div>
<header class="mb-space-xl">
<h1 class="font-headline-xl text-headline-xl text-on-surface tracking-tight">
        Sign in to data-flighto
      </h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-space-xs">
        Search and manage your flight bookings
      </p>
</header>
<form class="space-y-space-lg" onsubmit="event.preventDefault();">
<div class="space-y-space-xs">
<label class="block font-label-md text-label-md uppercase tracking-wider text-on-surface-variant" for="email">
          Email address
        </label>
<div class="relative flex items-center rounded-lg bg-surface-container-lowest transition-colors focus-within:bg-surface-container-highest/20">
<input autocomplete="email" class="w-full bg-transparent px-space-lg py-space-md font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none" id="email" placeholder="name@example.com" required="" type="email"/>
</div>
</div>
<div class="space-y-space-xs">
<div class="flex items-center justify-between">
<label class="block font-label-md text-label-md uppercase tracking-wider text-on-surface-variant" for="password">
            Password
          </label>
<a class="font-label-md text-label-md text-primary-container hover:underline transition-all" href="#">
            Forgot?
          </a>
</div>
<div class="relative flex items-center rounded-lg bg-surface-container-lowest transition-colors focus-within:bg-surface-container-highest/20">
<input autocomplete="current-password" class="w-full bg-transparent px-space-lg py-space-md font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none" id="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="mr-space-md flex items-center justify-center text-outline hover:text-on-surface transition-colors focus:outline-none" id="togglePassword" type="button">
<span class="material-symbols-outlined text-title-md" id="eyeIcon">visibility</span>
</button>
</div>
</div>
<div class="pt-space-sm">
<button class="w-full rounded-full bg-primary-container py-space-md font-label-lg text-label-lg text-on-primary font-medium transition hover:brightness-105 active:scale-[0.99] focus:outline-none" type="submit">
          Sign in
        </button>
</div>
</form>
<div class="mt-space-xl text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
        New here?
        <a class="font-body-md text-body-md text-primary-container hover:underline transition-colors" href="#">
          Create an account
        </a>
</p>
</div>
</div>
</div>
<script>
  (function() {
    const toggleBtn = document.getElementById('togglePassword');
    const pwdInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');

    if (toggleBtn && pwdInput && eyeIcon) {
      toggleBtn.addEventListener('click', function() {
        const isPassword = pwdInput.type === 'password';
        pwdInput.type = isPassword ? 'text' : 'password';
        eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }
  })();
</script></main></body></html>
